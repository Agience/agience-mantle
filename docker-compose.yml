# Mantle, alone — a smoke test for the image this repo builds.
#
# ⭐ ONE SERVICE, BECAUSE MANTLE IS ONE SERVICE. The store is a SQLite file plus a filesystem CAS
# opened in-process: there is no database container to provision, no cache, no queue. A compose
# file that invented companions would be describing a different product. The full platform stack
# — Origin for identity, MinIO as the local S3 edge — lives in `agience-observe`, and this file is
# deliberately not that.
#
# ⚠ TWO THINGS MUST EXIST BEFORE `up`:
#
#   1. The `agience-prism-py` build context. It is not on PyPI; the Dockerfile installs it from a
#      named context resolved here as a sibling checkout.
#
#   2. A populated `./.data/keys`. An empty KEYS_DIR does not boot — the lifespan loads an
#      encryption key and an inbound-nonce secret from files, and nothing generates them at
#      runtime:
#
#          python src/mantle/scripts/dev_init_keys.py --keys-dir ./.data/keys
#
# Then:
#
#     docker compose up --build
#     curl http://localhost:8081/
#
# The keys mount is READ-WRITE because `delete_setup_token()` removes `setup.token` once setup
# completes. A read-only mount is a supported configuration — the delete degrades to a warning —
# but writable is the honest default for a throwaway dev keyset.
#
# ⚠ THE IMAGE RUNS AS uid 10001, NOT root, so both mounts below must be writable by it. A named
# volume inherits the ownership the image set on `/app/.data`; these are BIND mounts, which do
# not — the host directory's own ownership wins. On Docker Desktop that is transparent; on Linux,
# `chown -R 10001:10001 ./.data` before `up`, or the first write fails with EACCES.

services:
  mantle:
    build:
      context: .
      dockerfile: build/Dockerfile
      additional_contexts:
        prism: ../agience-prism/py
    image: agience-mantle:local
    ports:
      - "${MANTLE_PORT:-8081}:8081"
    environment:
      # The two settings the Quick Start treats as primary.
      KEYS_DIR: /app/.data/keys
      MANTLE_LATTICE_PATH: /app/.data/mantle/mantle.db

      # This node's own public address, echoed in the landing page and the browser client's
      # server-declared redirect_uri.
      MANTLE_URI: ${MANTLE_URI:-http://localhost:8081}

      # Identity. `AUTHORITY_ISSUER` is what a token must carry as both `iss` and `aud`; it
      # defaults to `ORIGIN_URI`, so a node with no Origin needs an external issuer instead —
      # register one through `AGIENCE_TRUSTED_ISSUERS` (a JSON array) and name the operator by
      # `AGIENCE_OPERATOR_ID`. Standalone Mantle needs no Origin at runtime.
      AUTHORITY_ISSUER: ${AUTHORITY_ISSUER:-}
      AGIENCE_TRUSTED_ISSUERS: ${AGIENCE_TRUSTED_ISSUERS:-}
      AGIENCE_OPERATOR_ID: ${AGIENCE_OPERATOR_ID:-}

      # EMPTY, not unset. This stack has no Origin, and `ORIGIN_URI`'s in-code default is a
      # live-looking `http://localhost:8080` — which unset takes, so every `up` would spend
      # part of its boot connecting to a peer that is not in this file. Empty is a node
      # declaring it has no Origin, and is honoured as such: no call is made at all.
      ORIGIN_URI: ""

      # All local traffic shares one source IP, so the per-IP limiter is noise here. Production
      # takes the built-in default (600/min) or sets its own.
      AGIENCE_RATE_LIMIT_PER_MIN: "0"

      # No S3 edge in this stack: content stays on the local tier, which is a supported
      # configuration by design — a node whose working set is local answers with the backing
      # unreachable.
    volumes:
      - ./.data/keys:/app/.data/keys
      - ./.data/mantle:/app/.data/mantle
