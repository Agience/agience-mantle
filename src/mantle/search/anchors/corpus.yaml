# Generic grounded-knowledge corpus for bootstrapping the MANTLE AnchorSet.
#
# This is PUBLIC, NON-AUTHORIZING geometry: domain-neutral concept text used
# only to cluster the initial anchors of the shared vector coordinate system.
# It contains no platform content (no agents, personas, LLM connections, or
# authority) and no secrets — it ships with the generic engine so vector search
# works out of the box. Any platform seed artifacts an application provisions
# are unioned with this on bootstrap. The set grows as the manifold grows.
#
# Each entry: {slug, name, description, content}.

- slug: photosynthesis
  name: Photosynthesis
  description: How plants convert light into chemical energy
  content: >-
    Photosynthesis is the process by which green plants, algae, and some
    bacteria convert light energy, water, and carbon dioxide into glucose and
    oxygen using chlorophyll in their chloroplasts.

- slug: gravity
  name: Gravity
  description: The force of attraction between masses
  content: >-
    Gravity is the fundamental force by which objects with mass attract one
    another. On Earth it gives weight to physical objects and causes them to
    fall toward the ground when dropped.

- slug: photon
  name: Light and photons
  description: The nature of visible light
  content: >-
    Light is electromagnetic radiation visible to the human eye. It behaves both
    as a wave and as a stream of particles called photons, each carrying a
    discrete quantum of energy.

- slug: dna
  name: DNA and heredity
  description: The molecule of genetic inheritance
  content: >-
    DNA is a double-helix molecule that stores the genetic instructions used in
    the growth, development, and reproduction of all known living organisms,
    encoded in sequences of four nucleotide bases.

- slug: evolution
  name: Evolution by natural selection
  description: How species change over time
  content: >-
    Evolution is the change in heritable traits of biological populations over
    successive generations. Natural selection favours individuals whose traits
    improve survival and reproduction in their environment.

- slug: plate_tectonics
  name: Plate tectonics
  description: The movement of Earth's crust
  content: >-
    Plate tectonics describes the large-scale motion of the rigid plates that
    make up Earth's outer shell, driving earthquakes, volcanoes, mountain
    building, and the slow drift of continents.

- slug: water_cycle
  name: The water cycle
  description: How water moves through the environment
  content: >-
    The water cycle is the continuous movement of water on, above, and below the
    surface of the Earth through evaporation, condensation, precipitation,
    infiltration, and runoff.

- slug: supply_demand
  name: Supply and demand
  description: The basic model of market prices
  content: >-
    Supply and demand is an economic model of price determination in a market:
    the price of a good adjusts until the quantity that producers supply equals
    the quantity that consumers demand.

- slug: democracy
  name: Democracy
  description: Government by the people
  content: >-
    Democracy is a system of government in which political power rests with the
    citizens, who exercise it directly or through freely elected representatives,
    typically protected by rule of law and individual rights.

- slug: algorithm
  name: Algorithms
  description: Step-by-step procedures for computation
  content: >-
    An algorithm is a finite sequence of well-defined instructions used to solve
    a class of problems or perform a computation, forming the foundation of
    computer programming and data processing.

- slug: encryption
  name: Encryption
  description: Protecting information with cryptography
  content: >-
    Encryption transforms readable data into ciphertext using a mathematical
    key, so that only parties holding the correct key can recover the original
    information, protecting confidentiality and privacy.

- slug: neural_network
  name: Neural networks
  description: Machine learning inspired by the brain
  content: >-
    An artificial neural network is a computing system of interconnected nodes,
    loosely modelled on biological neurons, that learns to recognise patterns by
    adjusting connection weights from example data.

- slug: vaccine
  name: Vaccines and immunity
  description: How vaccination prevents disease
  content: >-
    A vaccine trains the immune system to recognise and fight a specific
    pathogen by exposing it to a harmless piece or weakened form of that
    pathogen, producing lasting protective immunity.

- slug: antibiotic
  name: Antibiotics
  description: Medicines that fight bacterial infection
  content: >-
    Antibiotics are drugs that kill bacteria or stop their growth, used to treat
    bacterial infections. Overuse drives antibiotic resistance, in which bacteria
    evolve to survive the drugs meant to destroy them.

- slug: solar_system
  name: The solar system
  description: The Sun and the bodies orbiting it
  content: >-
    The solar system consists of the Sun and everything gravitationally bound to
    it, including eight planets, their moons, dwarf planets, asteroids, and
    comets, formed from a collapsing cloud of gas and dust.

- slug: climate
  name: Climate and weather
  description: Long-term atmospheric patterns
  content: >-
    Weather is the short-term state of the atmosphere, while climate is the
    average of weather conditions over decades. Rising greenhouse gas
    concentrations are warming Earth's climate and shifting weather patterns.

- slug: language
  name: Human language
  description: How people communicate with symbols
  content: >-
    Language is a structured system of communication using sounds, signs, or
    written symbols governed by grammar, allowing humans to share complex ideas,
    record knowledge, and coordinate social life.

- slug: music
  name: Music and harmony
  description: Organised sound across cultures
  content: >-
    Music is the art of arranging sound in time through melody, harmony, rhythm,
    and timbre. Different cultures build distinctive scales and traditions, yet
    music universally expresses emotion and marks ritual.

- slug: architecture
  name: Architecture
  description: The design of buildings and space
  content: >-
    Architecture is the art and science of designing buildings and other
    physical structures, balancing function, safety, materials, and aesthetics
    to shape the spaces in which people live and work.

- slug: nutrition
  name: Nutrition
  description: How food fuels the body
  content: >-
    Nutrition is the study of how the body uses food. A balanced diet supplies
    carbohydrates, proteins, fats, vitamins, and minerals in the proportions
    needed for energy, growth, and the repair of tissue.

- slug: electricity
  name: Electricity
  description: The flow of electric charge
  content: >-
    Electricity is the set of physical phenomena associated with the presence
    and motion of electric charge. Electric current, the flow of electrons
    through a conductor, powers modern homes, industry, and devices.

- slug: ecosystem
  name: Ecosystems
  description: Communities of living things and their environment
  content: >-
    An ecosystem is a community of interacting organisms together with the
    physical environment they inhabit. Energy flows and nutrients cycle among
    producers, consumers, and decomposers to sustain the whole system.

- slug: probability
  name: Probability
  description: The mathematics of chance
  content: >-
    Probability is the branch of mathematics that quantifies uncertainty,
    assigning numbers between zero and one to the likelihood of events and
    underpinning statistics, insurance, and scientific inference.

- slug: navigation
  name: Navigation
  description: Finding position and route
  content: >-
    Navigation is the practice of determining one's position and planning a
    route between places, historically by stars and compass and today by
    satellite systems such as GPS that triangulate signals from orbit.
