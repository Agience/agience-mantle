[pytest]
# Blackbox E2E suite. Runs against a LIVE stack (origin :8080, mantle :8081) — it
# is intentionally isolated from the unit tests (no mantle/core imports), so it
# has its own rootdir here.
testpaths = .
python_files = test_*.py
addopts = -ra -q --strict-markers
markers =
    lazy: assertions that require MANTLE_LAZY_INDEX=on (first-observation regime)
    search: assertions that require the search backend (the lattice + MinIO) up
    external_issuer: assertions that register/use a self-signed second issuer
    events: assertions that open the /events websocket
