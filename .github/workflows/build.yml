name: build-image
# Publishes the agience-mantle image.
#   push to main  -> :edge
#   tag v*        -> :stable + :<version>
# Registry: GHCR by default (no secrets — uses GITHUB_TOKEN). To publish to
# Docker Hub instead, set repo variables REGISTRY=docker.io/agience and secrets
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN, and swap the login step below.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agience-mantle
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The shared foundation is a named build context (COPY --from=core ...).
      - name: Checkout agience-core (build context)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agience-core
          path: .core
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            printf 'tags=%s:stable,%s:%s\n' "$IMAGE" "$IMAGE" "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            printf 'tags=%s:edge\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-contexts: core=.core
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
