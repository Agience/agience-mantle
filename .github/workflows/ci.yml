name: ci

# Two jobs, because one `pip install .` followed by the full test suite tests neither half:
# it fails on the missing service extras and never checks that the base install — the
# standalone store, the whole product claim — stands on its own.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  # The base install: stdlib + `cryptography`, nothing else. `db/test_embeddable_surface.py`
  # is the enforcement — AST, runtime and functional checks that no sibling Agience package or
  # service dependency leaked into the store. Scoped to `src/mantle/db` only, not `tests/`,
  # because `tests/conftest.py` imports the FastAPI app and pulls in the service stack — this
  # job proves the opposite claim, so it must not import that fixture file at all.
  embeddable-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: pip install pytest
      - run: python -m pytest src/mantle/db -q

  # The full suite, including the service stack and the security-invariant tests. Needs
  # `agience-prism-py` on the path (see CONTRIBUTING.md).
  #
  # ⚠ PRISM COMES FROM A CHECKOUT, NOT FROM PyPI, and the `.[dev]` extra that names it cannot be
  # what resolves it. `agience-prism-py` is NOT a published package — the repo is private and
  # deliberately so — which this job asserted otherwise for its whole existence: the first time it
  # ever ran (2026-08-13) it failed with `No matching distribution found for agience-prism-py`.
  # Installing the checkout FIRST satisfies the requirement, so the `.[dev]` install below then
  # resolves without reaching an index for it. Same order, same reason, as `build-image.yml`.
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout agience-prism-py
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agience-prism-py
          path: .prism
          # Falls back to the job's own GITHUB_TOKEN when the PAT is absent. Supplying an
          # EMPTY token is a hard error ('Input required and not supplied'), which is a worse
          # failure than the Not Found it replaces.
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # setuptools/wheel: needed AT RUNTIME by `tests/test_wheel_ships_its_data.py`, which builds a
      # wheel in a subprocess and inspects it. See the same note in `build-image.yml`.
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install ./.prism
      # ⚠ `[dev]` DOES NOT CARRY THE SERVICE STACK, AND MUST NOT — pyproject.toml:152-186 states the
      # opposite requirement deliberately: `[dev]` has to install WITHOUT `[service]` so that
      # `test_beacon_conformance.py` runs for someone who only wants the store. But `tests/conftest.py`
      # imports `mantle.main` and httpx at module scope, so `tests/` cannot even be COLLECTED against a
      # `[dev]`-only environment: it dies in conftest with `No module named 'httpx'` before one test
      # runs (measured 2026-08-13, run 31705726733). The extras are right; this job was reading them as
      # a promise they never made. requirements.txt is the pinned runtime set the image itself
      # installs, so testing against it also means testing what ships. Same step, same position, same
      # reason as `build-image.yml:67`.
      - run: python -m pip install -r src/mantle/requirements.txt
      - run: pip install -e '.[dev]'
      # The ignored file measures a developer-workspace property CI cannot reproduce — see the
      # long note on the same flag in `build-image.yml`.
      - name: Run the suite (throwaway KEYS_DIR / MANTLE_LATTICE_PATH)
        env:
          # Preventive, not a diagnosed failure: `build-image.yml` pins this on the job running the
          # same suite and says one thread is the only safe setting in CI too. `mantle/__init__.py`
          # pins it on import, so this is redundant whenever mantle is imported before numpy — and
          # load-bearing exactly when it is not, which is the case nobody notices until OpenBLAS
          # faults at exit 139 or hangs. Two workflows running one suite should not disagree about
          # it, and the cheap side of that disagreement is this line.
          OPENBLAS_NUM_THREADS: "1"
        run: |
          KEYS_DIR="$RUNNER_TEMP/keys" MANTLE_LATTICE_PATH="$RUNNER_TEMP/mantle.db" \
            python -m pytest tests src/mantle -q \
              --ignore=tests/test_the_apache_store_is_a_product.py
