name: Release

# Cut a release by running this workflow MANUALLY (see the PARKED note below — the tag trigger is
# removed on purpose). When it is restored, the tag minus "v" must match `version` in
# pyproject.toml:
#     git tag v0.1.0 && git push origin v0.1.0
# One job builds, creates the GitHub Release, and publishes to PyPI via
# Trusted Publishing (OIDC) — no token stored. Tests are NOT re-run here:
# ci.yml gates every commit on main, and the tag points at a tested one.
#
# Only the BASE install (stdlib + cryptography) is published here — the `service`,
# `semantic` and `dev` extras still declare `agience-prism-py`, resolved from PyPI once that
# package is published in its own repo. No change needed here when that happens; the extras
# already name it.
# ⛔ PARKED 2026-08-13 — `workflow_dispatch` ONLY, DELIBERATELY. This used to trigger on `v*`,
# which is the SAME trigger `build-image.yml` uses to cut a release image. Tagging `v0.1.0` to
# produce an image therefore also fired PyPI Trusted Publishing against a publisher that does not
# exist, and created a public GitHub Release as a side effect of an internal build. Two unrelated
# outcomes on one tag, one of them outward-facing and unintended.
#
# Neither `agience-mantle` nor `agience-prism-py` is published, and the current decision (John,
# 2026-08-13) is that both stay private. The job below is CORRECT CODE for a future public cut and
# is kept rather than deleted; it simply must not be reachable by pushing a tag. Restore the
# `push: tags:` trigger when a PyPI publisher actually exists — and note the `dev`/`service`/
# `semantic` extras still name `agience-prism-py`, so mantle cannot publish usefully until prism
# does.
on:
  workflow_dispatch: {}      # manual dry run: build only (no release/publish)

permissions:
  contents: write            # create the GitHub Release
  id-token: write            # PyPI Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi         # must match the PyPI publisher's Environment name
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$tag  pyproject=$ver"
          test "$tag" = "$ver" || { echo "::error::tag v$tag != pyproject version $ver"; exit 1; }
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
