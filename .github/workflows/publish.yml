name: Release

# Cut a release by pushing a tag. The tag minus "v" must match `version` in pyproject.toml, and the
# job below refuses the pair when they disagree:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# One job builds, creates the GitHub Release, and publishes to PyPI via Trusted Publishing (OIDC) —
# no token stored. Tests are not re-run here: ci.yml gates every commit on main, and the tag points
# at a tested one.
#
# Mantle is distributed on PyPI and only on PyPI; there is no image. The `service`, `semantic` and
# `dev` extras declare `agience-prism`, which is published, so an extras install resolves from an
# index with no sibling checkout.
#
# Two things must be true before a tag publishes anything, and neither lives in this file:
#
#   1. A PyPI Trusted Publisher for `agience-mantle` naming this repository, this workflow file, and
#      the `pypi` environment below. Without it the publish step fails at the OIDC exchange.
#   2. A `pypi` environment on this repository. The `environment:` key below is what the publisher
#      matches against.
#
# A version is permanent once published: PyPI refuses a re-upload of the same version, so a bad cut
# is fixed by releasing a new version rather than by replacing one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}      # manual dry run: builds and twine-checks, publishes nothing

permissions:
  contents: write            # create the GitHub Release
  id-token: write            # PyPI Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi         # must match the PyPI publisher's Environment name
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$tag  pyproject=$ver"
          test "$tag" = "$ver" || { echo "::error::tag v$tag != pyproject version $ver"; exit 1; }
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
